[package]
name = "nezha-agent-rust"
version = "2.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
md5 = "0.7"
http = "1"
indexmap = { version = "1.9", features = ["std"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.13"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
semver = "1"
self-replace = "1.5"
sysinfo = "0.30"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-native-roots"] }
tower = { version = "0.4", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
roxmltree = "0.20"
socket2 = "0.6"
surge-ping = "0.9"

[patch.crates-io]
surge-ping = { path = "vendor/surge-ping" }
