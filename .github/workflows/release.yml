name: Rust Agent Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          NZ_RUST_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          source_path="target/${{ matrix.target }}/release/nezha-agent-rust"
          suffix=""
          if [[ '${{ matrix.os }}' == 'windows-latest' ]]; then
            suffix='.exe'
          fi
          cp "${source_path}${suffix}" "dist/nezha-agent-rust-${{ matrix.target }}${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-agent-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-agent-*
          path: dist
          merge-multiple: true
      - name: Generate update manifest
        run: python3 tests/make_update_manifest.py --version "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --directory dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
